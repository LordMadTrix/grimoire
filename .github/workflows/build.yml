name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Grimoire v__VERSION__"
          releaseBody: "### 🗺️ Grimoire v0.2.0 — Éditeur de Carte et Outils d'Environnement\n\nCette mise à jour majeure transforme l'éditeur de carte de Grimoire avec des fonctionnalités de création de mondes ultra performantes.\n\n#### ✨ Nouveautés :\n- **Pinceau à Tampons (Scatter Tool)** : Dessinez des dizaines d'arbres, de rochers ou de montagnes aléatoires d'un seul coup de pinceau.\n- **Pinceau Remplissage** : Peignez instantanément de vastes zones d'eau ou de terre.\n- **Pinceau Rugueux** : Sculptage réaliste des côtes avec fractal noise.\n- **Chemins Adoucis** : Tracé vectoriel lissé avec courbes de Bézier pour des rivières et des routes élégantes.\n- **Générateur de Continents Automatique** : Créez une nouvelle carte continentale en 1 clic grâce à un algorithme de bruit cellulaire.\n- **Refonte UI de l'Éditeur** : Nouveaux panneaux, curseurs et intégration d'un catalogue massif de textures.\n\n*Dessinez des mondes magnifiques en quelques clics !*"
          releaseDraft: false
          prerelease: false
