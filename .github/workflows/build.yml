name: Build and Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: npm install

      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Grimoire v__VERSION__"
          releaseBody: "### 🐉 Grimoire v0.1.2 — Mimic Pack & GM Tools\n\nCette version apporte le support complet des outils MJ avancés et l'intégration du Pack Mimic.\n\n#### ✨ Nouveautés :\n- **Pack Mimic** : 4 tokens illustrés intégrés à la bibliothèque.\n- **ConditionWheel** : Gestion radiale des conditions sur les tokens.\n- **Calculateur de Dégâts** : Outil de calcul et d'application de dégâts multi-cibles.\n- **Générateurs MJ** : Rencontres, Salles, Météo et Relations PNJ.\n- **Suivi des Durées** : Countdown automatique des effets (Torches, Sorts).\n- **Notes Partagées** : Overlay de notes en temps réel pour les joueurs.\n- **Export PNG** : Capture haute résolution de la carte VTT.\n\n*Prêt pour l'aventure !*"
          releaseDraft: false
          prerelease: false
