<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
    />
    <title>Inkarnate - Loading</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: #141414;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }

      .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .logo-image {
        width: 400px;
        height: auto;
        margin-bottom: 60px;
      }

      .progress-container {
        width: 400px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: #ffffff;
        border-radius: 2px;
        width: 0%;
        transition: width 0.3s ease-out;
      }

      /* Indeterminate animation for initial loading */
      .progress-bar.indeterminate {
        width: 30%;
        animation: indeterminate 1.5s ease-in-out infinite;
      }

      @keyframes indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(433%);
        }
      }

      .status-text {
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        font-weight: 400;
        min-height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <img src="logo.svg" alt="Inkarnate" class="logo-image" />
      <div class="progress-container">
        <div id="progress-bar" class="progress-bar indeterminate"></div>
      </div>
      <div id="status-text" class="status-text"></div>
    </div>
    <script>
      const progressBar = document.getElementById('progress-bar');
      const statusText = document.getElementById('status-text');

      // Set up update status listener and signal ready to main process
      const setupUpdateListener = () => {
        if (window.updateAPI && window.updateAPI.onUpdateStatus) {
          window.updateAPI.onUpdateStatus((status, data) => {
            console.log('Update status received:', status, data);
            switch (status) {
              case 'checking':
                statusText.textContent = 'Checking for updates...';
                break;
              case 'available':
                statusText.textContent = data?.version
                  ? `Downloading version ${data.version}...`
                  : 'Downloading update...';
                progressBar.classList.remove('indeterminate');
                progressBar.style.width = '0%';
                break;
              case 'progress':
                const percent = data?.percent ?? 0;
                statusText.textContent = data?.version
                  ? `Downloading version ${data.version}... ${percent}%`
                  : `Downloading update... ${percent}%`;
                progressBar.classList.remove('indeterminate');
                progressBar.style.width = `${percent}%`;
                break;
              case 'downloaded':
                statusText.textContent = data?.version
                  ? `Installing version ${data.version}...`
                  : 'Installing update...';
                progressBar.style.width = '100%';
                break;
              case 'not-available':
              case 'error':
                statusText.textContent = 'Loading...';
                progressBar.classList.remove('indeterminate');
                progressBar.style.width = '90%';
                break;
            }
          });

          // Signal to main process that we're ready to receive update messages
          if (window.updateAPI.signalReady) {
            window.updateAPI.signalReady();
            console.log('Splash signaled ready to main process');
          }
          return true;
        }
        return false;
      };

      // Try to set up immediately, or wait for window load
      const init = () => {
        if (!setupUpdateListener()) {
          // If API not ready, try a few times with limited retries
          let retryCount = 0;
          const maxRetries = 5; // Max 500ms of retries

          const retry = () => {
            retryCount++;
            if (retryCount <= maxRetries) {
              if (setupUpdateListener()) {
                return; // Success
              }
              setTimeout(retry, 100);
            }
          };

          retry();
        }
      };

      // Initialize when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
