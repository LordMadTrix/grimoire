# Ce fragment de workflow GitHub Actions peut être réintégré dans .github/workflows/build.yml
# dès que le token GitHub possède le scope 'workflow' (via: gh auth refresh -h github.com -s workflow).
  build-android-companion:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: prepare companion assets
        run: |
          node scripts/sync-companion.mjs
          cd player-companion
          npm install
          npx cap sync android

      - name: build Android APK
        run: |
          cd player-companion/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: upload APK to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: player-companion/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

