[package]
name = "grimoire"
version = "0.4.4"
description = "Grimoire - Outil de Maître du Jeu TTRPG & VTT Local"
authors = ["MadTrix"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "grimoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# File watching
notify = "8"

# Logging
log = "0.4"

# Async
tokio = { version = "1", features = ["full"] }

# Markdown parsing
pulldown-cmark = "0.12"

# Regex for [[links]]
regex = "1"

# Path walking
walkdir = "2"
base64 = "0.22.1"
reqwest = { version = "0.13.3", features = ["json"] }

# Serveur mobile joueurs
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
qrcode = "0.14"
opener = "0.7"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 2
lto = false
codegen-units = 4
panic = "abort"
